<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SME 회로 검색 사이트</title>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link href="https://cdnjs.cloudflare.com/ajax/libs/JetBrains-Mono/2.304/JetBrainsMono.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --bg:#12161c;
    --panel:#1a2029;
    --panel-2:#212936;
    --line:#2a3341;
    --text:#e7ebf1;
    --sub:#8b96a8;
    --amber:#ffb020;
    --amber-dim:#5c4520;
    --blue:#5aa9ff;
    --purple:#b98af7;
    --orange:#ff8a4c;
    --green:#4ade80;
    --red:#f9776d;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    min-height:100vh;
    background-image:
      radial-gradient(circle at 15% 0%, rgba(255,176,32,0.06), transparent 45%),
      radial-gradient(circle at 100% 20%, rgba(90,169,255,0.05), transparent 50%);
  }
  .mono{font-family:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;}

  header{
    position:sticky; top:0; z-index:20;
    background:rgba(18,22,28,0.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:14px 16px 16px;
  }
  .brand{
    display:flex; align-items:baseline; gap:8px; margin-bottom:12px;
  }
  .title-link{text-decoration:none; cursor:pointer;}
  .title-link:active .brand h1{color:var(--amber);}
  .brand h1{font-size:15px; margin:0; font-weight:600; color:var(--text); transition:color .1s;}
  .brand h1 span{color:var(--sub); font-weight:400;}

  .search-wrap{position:relative;}
  #q{
    width:100%; padding:14px 44px 14px 16px; border-radius:12px;
    border:1.5px solid var(--line); background:var(--panel); color:var(--text);
    font-size:17px; font-family:"JetBrains Mono", monospace; letter-spacing:.02em;
    outline:none; transition:border-color .15s, box-shadow .15s;
  }
  #q::placeholder{color:#566072; font-family:-apple-system,sans-serif; font-size:14px; letter-spacing:0;}
  #q:focus{border-color:var(--amber); box-shadow:0 0 0 3px rgba(255,176,32,0.15);}
  .clear-btn{
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    width:30px; height:30px; border-radius:8px; border:none;
    background:var(--panel-2); color:var(--sub); font-size:16px; cursor:pointer;
    display:none; align-items:center; justify-content:center;
  }
  .clear-btn.show{display:flex;}
  .hint{margin-top:8px; font-size:12px; color:var(--sub);}

  main{max-width:640px; margin:0 auto; padding:16px; padding-bottom:60px;}

  /* Suggestion picker */
  .picker{display:flex; flex-direction:column; gap:6px; margin-top:4px;}
  .picker-item{
    display:flex; align-items:center; gap:10px;
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:11px 12px; cursor:pointer; text-align:left;
  }
  .picker-item:active{background:var(--panel-2);}
  .picker-item .code{font-size:14px; color:var(--amber); min-width:118px;}
  .picker-item .name{font-size:12.5px; color:var(--sub); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  /* Empty / not found states */
  .state{
    text-align:center; padding:56px 20px; color:var(--sub);
  }
  .state .icon{font-size:34px; margin-bottom:10px; opacity:.7;}
  .state .msg{font-size:14px; line-height:1.6;}
  .state .msg b{color:var(--text);}

  /* Result trace list */
  .trace{position:relative; margin-top:18px;}
  .trace::before{
    content:""; position:absolute; left:20px; top:8px; bottom:8px; width:2px;
    background:linear-gradient(var(--line), var(--line));
  }
  .row{
    position:relative; display:flex; gap:12px; padding:10px 8px 10px 44px;
    border-radius:10px; margin-bottom:2px;
  }
  .row .dot{
    position:absolute; left:14px; top:18px; width:14px; height:14px; border-radius:50%;
    background:var(--panel-2); border:2px solid var(--line);
  }
  .row .body{flex:1; min-width:0; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px;}
  .row .top-line{display:flex; align-items:center; gap:10px; margin-bottom:4px; flex-wrap:wrap;}
  .row .code{font-size:14.5px; font-weight:600; color:var(--text);}
  .row .badge{
    font-size:11.5px; font-weight:800; letter-spacing:.05em; padding:4px 9px; border-radius:6px;
    font-family:"JetBrains Mono", monospace; border:1px solid transparent;
  }
  .badge-FSP{background:rgba(90,169,255,0.18); color:#8cc2ff; border-color:rgba(90,169,255,0.35);}
  .badge-FMM{background:rgba(185,138,247,0.18); color:#cba9fa; border-color:rgba(185,138,247,0.35);}
  .badge-FRM{background:rgba(255,138,76,0.18); color:#ffab7a; border-color:rgba(255,138,76,0.35);}
  .row .phase{
    font-size:11px; font-weight:600; color:var(--sub);
    padding:3px 8px; border-radius:6px; background:var(--panel-2); border:1px solid var(--line);
  }
  .row .no{margin-left:auto; font-size:10.5px; color:#566072;}
  .row .name{font-size:12.5px; color:var(--sub); line-height:1.5;}
  .row .meta{font-size:10.5px; color:#566072; margin-top:5px;}

  .row.match{padding-left:44px; scroll-margin-top:150px;}
  .row.match .dot{
    width:16px; height:16px; left:13px; top:22px;
    background:var(--amber); border-color:var(--amber);
    box-shadow:0 0 0 4px rgba(255,176,32,0.18), 0 0 14px rgba(255,176,32,0.55);
  }
  .row.match .body{
    background:linear-gradient(180deg, rgba(255,176,32,0.10), rgba(255,176,32,0.03));
    border:1.5px solid var(--amber);
  }
  .row.match .code{color:var(--amber); font-size:16.5px;}
  .row.match .name{color:var(--text); font-size:13.5px;}
  .row.context{opacity:.72;}
  .row.context .body{padding:8px 12px;}

  .section-label{
    font-size:10.5px; color:#566072; letter-spacing:.1em; margin:14px 0 6px 44px;
    font-family:"JetBrains Mono", monospace;
  }

  footer{
    text-align:center; padding:20px; color:#3d4759; font-size:11px;
  }

  /* 카드 탭 시 상세정보 바텀시트 */
  .row .body{cursor:pointer; transition:border-color .12s, background .12s;}
  .row .body:active{border-color:var(--amber);}

  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(6,8,11,0.6); backdrop-filter:blur(2px);
    opacity:0; pointer-events:none; transition:opacity .18s; z-index:40;
  }
  .sheet-backdrop.show{opacity:1; pointer-events:auto;}

  .sheet-panel{
    position:fixed; left:0; right:0; bottom:0; z-index:41;
    max-width:640px; margin:0 auto;
    background:var(--panel); border:1px solid var(--line); border-bottom:none;
    border-radius:18px 18px 0 0;
    max-height:82vh; overflow-y:auto;
    transform:translateY(100%); transition:transform .22s ease;
    box-shadow:0 -8px 30px rgba(0,0,0,0.45);
  }
  .sheet-panel.show{transform:translateY(0);}
  .sheet-handle{
    width:40px; height:4px; border-radius:2px; background:var(--line);
    margin:10px auto 4px;
  }
  .sheet-content{padding:6px 20px 28px;}
  .sheet-close{
    position:absolute; top:12px; right:14px; width:30px; height:30px; border-radius:8px;
    border:none; background:var(--panel-2); color:var(--sub); font-size:16px; cursor:pointer;
  }
  .sheet-code{font-family:"JetBrains Mono", monospace; font-size:16px; font-weight:700; color:var(--amber); margin:8px 0 2px;}
  .sheet-name{font-size:13px; color:var(--sub); margin-bottom:16px; line-height:1.5;}
  .sheet-section-title{
    font-size:11px; letter-spacing:.08em; color:#566072; margin:18px 0 8px;
    font-family:"JetBrains Mono", monospace; text-transform:uppercase;
  }
  .sheet-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .sheet-field{
    background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:9px 11px;
  }
  .sheet-field .k{font-size:10.5px; color:#566072; margin-bottom:3px;}
  .sheet-field .v{font-size:13.5px; color:var(--text); font-weight:600; font-family:"JetBrains Mono", monospace;}
  .cbe-list{display:flex; flex-wrap:wrap; gap:6px;}
  .cbe-chip{
    font-family:"JetBrains Mono", monospace; font-size:12px; font-weight:600;
    background:rgba(255,176,32,0.12); color:var(--amber); border:1px solid var(--amber-dim);
    padding:5px 10px; border-radius:7px;
  }
  .sheet-empty{font-size:12.5px; color:#566072;}
  .sheet-loading{font-size:12.5px; color:var(--sub); padding:12px 0;}

  .sheet-back{
    position:absolute; top:12px; left:14px; height:30px; padding:0 10px; border-radius:8px;
    border:none; background:var(--panel-2); color:var(--sub); font-size:12.5px; cursor:pointer;
  }
  .sheet-code{margin-top:8px; padding-left:0;}
  .sheet-code.with-back{padding-left:62px;}

  .action-list{display:flex; flex-direction:column; gap:10px;}
  .action-btn{
    display:flex; align-items:center; gap:12px; text-align:left;
    background:var(--panel-2); border:1px solid var(--line); border-radius:12px;
    padding:14px 14px; cursor:pointer;
  }
  .action-btn:active{border-color:var(--amber); background:rgba(255,176,32,0.08);}
  .action-icon{font-size:20px; flex-shrink:0;}
  .action-text{display:flex; flex-direction:column; gap:2px;}
  .action-title{font-size:14px; font-weight:700; color:var(--text);}
  .action-sub{font-size:11.5px; color:var(--sub);}

  .group-list{display:flex; flex-direction:column; gap:8px;}
  .group-row{
    display:block; width:100%; text-align:left; cursor:pointer;
    background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:10px 12px;
  }
  .group-row .top-line{display:flex; align-items:center; gap:8px; margin-bottom:3px;}
  .group-row .code{font-size:13.5px; font-weight:700; color:var(--text);}
  .group-row .gname{font-size:12px; color:var(--sub); line-height:1.5;}
  .group-row.current{border-color:var(--amber); background:rgba(255,176,32,0.10);}
  .group-row.current .code{color:var(--amber);}

  @media (min-width:700px){
    main{padding-top:28px;}
    .brand h1{font-size:16px;}
    #q{font-size:16px;}
  }
</style>
</head>

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function badge(type){
  return `<span class="badge badge-${type}">${type}</span>`;
}

function renderRow(item, cls){
  return `
    <div class="row ${cls}">
      <div class="dot"></div>
      <div class="body" data-code="${escapeHtml(item.code)}">
        <div class="top-line">
          <span class="code mono">${escapeHtml(item.code)}</span>
          ${badge(item.type)}
          ${item.sheet ? `<span class="phase mono">${escapeHtml(item.sheet)}</span>` : ''}
          <span class="no mono">NO.${item.no}</span>
        </div>
        <div class="name">${escapeHtml(item.name)}</div>
        <div class="meta mono">${escapeHtml(item.node)}</div>
      </div>
    </div>`;
}

function renderMatch(index){
  const start = Math.max(0, index - 5);
  const end = Math.min(DATA.length - 1, index + 5);
  let html = '';

  html += `<div class="trace">`;
  for(let i = start; i < index; i++){
    if(i === start) html += `<div class="section-label">이전 5개</div>`;
    html += renderRow(DATA[i], 'context');
  }
  html += renderRow(DATA[index], 'match');
  for(let i = index + 1; i <= end; i++){
    if(i === index + 1) html += `<div class="section-label">다음 5개</div>`;
    html += renderRow(DATA[i], 'context');
  }
  html += `</div>`;

  mainEl.innerHTML = html;

  // 모바일 키보드 닫기 + 매치된 항목을 화면 위쪽으로 스크롤
  qEl.blur();
  const matchEl = mainEl.querySelector('.row.match');
  if(matchEl){
    requestAnimationFrame(() => {
      matchEl.scrollIntoView({behavior: 'smooth', block: 'start'});
    });
  }
}

function renderPicker(matches){
  let html = `<div class="picker">`;
  matches.slice(0, 30).forEach(item => {
    html += `<button class="picker-item" data-code="${escapeHtml(item.code)}">
      <span class="code mono">${escapeHtml(item.code)}</span>
      <span class="name">${escapeHtml(item.name)}</span>
    </button>`;
  });
  html += `</div>`;
  if(matches.length > 30){
    html += `<div class="hint" style="text-align:center;margin-top:10px;">그 외 ${matches.length - 30}개 더 있습니다. 더 구체적으로 입력해 주세요.</div>`;
  }
  mainEl.innerHTML = html;

  mainEl.querySelectorAll('.picker-item').forEach(btn => {
    btn.addEventListener('click', () => {
      qEl.value = btn.dataset.code;
      doSearch();
    });
  });
}

// 회로번호 유연 검색: 공백 무시, N/L 생략 허용, D/M 문자 생략 시 둘 다 매칭
function normalizeQuery(str){
  return str.trim().toUpperCase().replace(/\s+/g, '');
}
function codeNoNL(code){
  return code.replace(/[NL]/g, ''); // N, L 제거 (예: N088L01D003 → 08801D003)
}
function codeDigitsOnly(code){
  return code.replace(/[^0-9]/g, ''); // 숫자만 (예: N088L01D003 → 08801003)
}
function isFlexibleMatch(q, code){
  if(!q) return false;
  if(code === q) return true;

  const qNoNL = q.replace(/[NL]/g, '');
  const qDigits = q.replace(/[^0-9]/g, '');
  const hasLetter = /[DM]/.test(qNoNL);

  if(hasLetter){
    // D 또는 M을 명시한 경우: 해당 문자까지 일치해야 함 (D003 ≠ M003)
    return (qNoNL.length > 0 && codeNoNL(code).includes(qNoNL)) || code.includes(q);
  } else {
    // D/M 생략한 경우: 숫자만 맞으면 D/M 둘 다 매칭
    // 단, 숫자가 1~2자리뿐이면 거의 모든 코드에 우연히 포함되므로(예: "3F"→"3") 제외
    return (qDigits.length >= 3 && codeDigitsOnly(code).includes(qDigits)) ||
           (qNoNL.length > 0 && codeNoNL(code).includes(qNoNL)) ||
           code.includes(q);
  }
}

// CRT 명칭(이름) 검색: 공백 유무 상관없이 부분 일치
function normalizeName(str){
  return str.trim().toUpperCase();
}
function isNameMatch(rawQuery, name){
  if(!rawQuery || !name) return false;
  const terms = rawQuery.trim().toUpperCase().split(/\s+/).filter(Boolean);
  if(terms.length === 0) return false;
  const nn = name.toUpperCase();
  return terms.every(t => nn.includes(t));
}

function doSearch(){
  const rawInput = qEl.value;
  const q = normalizeQuery(rawInput);
  clearBtn.classList.toggle('show', q.length > 0);

  if(!q){
    renderIdle();
    hintEl.textContent = '회로번호 또는 명칭을 입력하면 검색됩니다.';
    return;
  }

  const exactIndex = DATA.findIndex(d => d.code === q);
  if(exactIndex !== -1){
    renderMatch(exactIndex);
    hintEl.textContent = `일치: ${DATA[exactIndex].code}`;
    return;
  }

  const matches = DATA.filter(d => isFlexibleMatch(q, d.code) || isNameMatch(rawInput, d.name));
  if(matches.length === 1){
    const idx = DATA.findIndex(d => d.code === matches[0].code);
    renderMatch(idx);
    hintEl.textContent = `일치: ${matches[0].code}`;
    return;
  }
  if(matches.length > 1){
    renderPicker(matches);
    hintEl.textContent = `${matches.length}개 후보 · 탭하여 선택`;
    return;
  }

  renderEmpty();
  hintEl.textContent = '검색 결과 없음';
}

qEl.addEventListener('input', doSearch);
clearBtn.addEventListener('click', () => {
  qEl.value = '';
  qEl.focus();
  doSearch();
});

// 컬럼 순서: NO, 회로번호, CRT 명칭, TYPE, 출처 시트, 출처 노드 (헤더 행 제외)
function csvRowsToData(rows){
  const out = [];
  rows.forEach(r => {
    const code = (r[1] || '').toString().trim();
    if(!code || code.toUpperCase() === '회로번호') return; // 헤더/빈행 skip
    out.push({
      no: r[0] || '',
      code: code,
      name: (r[2] || '').toString().trim(),
      type: (r[3] || '').toString().trim(),
      sheet: (r[4] || '').toString().trim(),
      node: (r[5] || '').toString().trim(),
    });
  });
  return out;
}

function loadFromGoogleSheet(){
  if(!GOOGLE_SHEET_CSV_URL){ return; }
  fetch(GOOGLE_SHEET_CSV_URL, {cache: 'no-store'})
    .then(res => {
      if(!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    })
    .then(csvText => {
      const parsed = Papa.parse(csvText, {skipEmptyLines: true});
      const rows = parsed.data.slice(1); // 헤더 제거
      const fresh = csvRowsToData(rows);
      if(fresh.length > 0){
        DATA = fresh;
        document.getElementById('totalCount').textContent = DATA.length;
        hintEl.textContent = '최신 데이터 로드 완료 · 회로번호 또는 명칭을 입력해 주세요.';
      }
    })
    .catch(err => {
      console.warn('구글 시트 로드 실패, 내장 데이터 사용:', err);
    });
}

// ── VFT 상세정보 (TypeLabel, FlashLabel, Silenceable 등, CBE1~10) ──
function loadVftData(){
  if(!VFT_SHEET_CSV_URL || vftLoading || vftLoaded) return;
  vftLoading = true;
  fetch(VFT_SHEET_CSV_URL, {cache: 'no-store'})
    .then(res => {
      if(!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    })
    .then(csvText => {
      const parsed = Papa.parse(csvText, {skipEmptyLines: true, header: true});
      const map = {};
      parsed.data.forEach(row => {
        const code = (row['ADDLIST'] || '').toString().trim().toUpperCase();
        if(!code) return;
        map[code] = row;
      });
      vftMap = map;
      vftLoaded = true;
      vftLoading = false;
      // 바텀시트가 '불러오는 중'으로 열려 있었다면 갱신
      const openCode = sheetPanel.dataset.openCode;
      const openView = sheetPanel.dataset.openView;
      if(openCode === undefined) return;
      if(openView === 'group') renderGroupContent(openCode);
      else if(openView === 'detail') renderSheetContent(openCode);
    })
    .catch(err => {
      vftLoading = false;
      console.warn('VFT 상세정보 로드 실패:', err);
      const openCode = sheetPanel.dataset.openCode;
      if(openCode) renderSheetError();
    });
}

function fieldBlock(label, value){

  return `<div class="sheet-field"><div class="k">${escapeHtml(label)}</div><div class="v">${escapeHtml(v)}</div></div>`;
}

// ── SOL 검토와 동일한 원리: CBE(연동 코드)가 실제로 겹치는 회로끼리 묶음 ──
// Z901~Z907처럼 건물 전체에 공통으로 걸리는 코드는 제외하고,
// 3자리 Z/ZL 코드의 앞 2자리(그룹 베이스, 예: Z561/Z563 → 56)가 같으면 같은 구역으로 판별한다.
const COMMON_CBE_CODES = ['901','902','903','904','905','906','907'];

function nodePrefix(code){
  const m = code.match(/^N\d+/i);
  return m ? m[0].toUpperCase() : '';
}

// 회로의 '구역 베이스' 목록 반환 (예: ['Z56','ZL16'])
function distinctiveBasesOf(code){
  const detail = vftMap[code];
  if(!detail) return [];
  const out = [];
  for(let i = 1; i <= 10; i++){
    const v = (detail['CBE' + i] || '').toString().trim();
    const m = v.match(/^(ZL?)(\d{3})$/i);
    if(!m) continue;
    const num = m[2];
    if(COMMON_CBE_CODES.includes(num)) continue;
    out.push(num.slice(0, 2)); // Z/ZL 접두사 구분 없이 숫자 베이스(앞 2자리)만 비교 (파이썬의 ZL?{grp}\d 패턴과 동일)
  }
  return out;
}

// 표시용: 회로의 distinctive 원본 코드 목록 (Z561, ZL167 등)
function distinctiveCodesOf(code){
  const detail = vftMap[code];
  if(!detail) return [];
  const out = [];
  for(let i = 1; i <= 10; i++){
    const v = (detail['CBE' + i] || '').toString().trim();
    const m = v.match(/^(ZL?)(\d{3})$/i);
    if(!m) continue;
    if(COMMON_CBE_CODES.includes(m[2])) continue;
    out.push(v.toUpperCase());
  }
  return out;
}

function backButton(code){
  return `<button class="sheet-back" id="sheetBackBtn">‹ 뒤로</button>`;
}

function bindSheetBack(code){
  const btn = document.getElementById('sheetBackBtn');
  if(btn) btn.addEventListener('click', () => openActionSheet(code));
}

function renderSheetContent(code){
  sheetPanel.dataset.openView = 'detail';
  const item = DATA.find(d => d.code === code);
  const detail = vftMap[code];

  let html = `<button class="sheet-close" id="sheetCloseBtn" aria-label="닫기">✕</button>`;
  html += backButton(code);
  html += `<div class="sheet-code mono with-back">${escapeHtml(code)}</div>`;
  if(item) html += `<div class="sheet-name">${escapeHtml(item.name)}</div>`;

  if(!vftLoaded && vftLoading){
    html += `<div class="sheet-loading">상세정보 불러오는 중…</div>`;
    sheetContent.innerHTML = html;
    bindSheetClose();
    bindSheetBack(code);
    return;
  }

  if(!detail){
    html += `<div class="sheet-empty">이 회로에 대한 VFT 상세정보가 없습니다.</div>`;
    sheetContent.innerHTML = html;
    bindSheetClose();
    bindSheetBack(code);
    return;
  }

  html += `<div class="sheet-section-title">디바이스 정보</div>`;
  html += `<div class="sheet-grid">`;
  html += fieldBlock('TypeLabel', detail['TypeLabel']);
  html += fieldBlock('FlashLabel', detail['FlashLabel']);
  html += `</div>`;

  // 회로번호 끝자리 문자(D/M)로 감지기(D)/중계기(M) 판별
  const deviceLetterMatch = code.match(/([DM])\d+$/);
  const isRelayM = deviceLetterMatch && deviceLetterMatch[1] === 'M';

  html += `<div class="sheet-section-title">감도 / 경보 설정</div>`;
  html += `<div class="sheet-grid">`;
  html += fieldBlock('Silenceable', detail['Silenceable']);
  html += fieldBlock('AlarmVer', detail['AlarmVer']);
  if(!isRelayM){
    html += fieldBlock('PreAlarmSensitivity', detail['PreAlarmSensitivity']);
    html += fieldBlock('AlarmSensitivity', detail['AlarmSensitivity']);
    html += fieldBlock('PreAlarmSensitivityUnocc', detail['PreAlarmSensitivityUnocc']);
    html += fieldBlock('AlarmSensitivityUnocc', detail['AlarmSensitivityUnocc']);
  }
  html += `</div>`;

  const cbeValues = [];
  for(let i = 1; i <= 10; i++){
    const v = (detail['CBE' + i] || '').toString().trim();
    if(v) cbeValues.push(v);
  }
  html += `<div class="sheet-section-title">CBE 연동 (${cbeValues.length})</div>`;
  if(cbeValues.length > 0){
    html += `<div class="cbe-list">` + cbeValues.map(v => `<span class="cbe-chip">${escapeHtml(v)}</span>`).join('') + `</div>`;
  } else {
    html += `<div class="sheet-empty">연동된 CBE가 없습니다.</div>`;
  }

  sheetContent.innerHTML = html;
  bindSheetClose();
  bindSheetBack(code);
}

function renderSheetError(){
  sheetContent.innerHTML = `
    <button class="sheet-close" id="sheetCloseBtn" aria-label="닫기">✕</button>
    <div class="sheet-empty" style="margin-top:20px;">상세정보를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</div>`;
  bindSheetClose();
}

// SOL 검토 방식과 동일: CBE(연동 코드)가 실제로 겹치는 회로끼리 묶어서 보여줌
function renderGroupContent(code){
  sheetPanel.dataset.openView = 'group';
  const item = DATA.find(d => d.code === code);
  let html = `<button class="sheet-close" id="sheetCloseBtn" aria-label="닫기">✕</button>`;
  html += backButton(code);
  html += `<div class="sheet-code mono with-back">${escapeHtml(code)}</div>`;
  if(item) html += `<div class="sheet-name">${escapeHtml(item.name)}</div>`;

  if(!item){
    html += `<div class="sheet-empty">회로 정보를 찾을 수 없습니다.</div>`;
    sheetContent.innerHTML = html;
    bindSheetClose(); bindSheetBack(code);
    return;
  }

  if(!vftLoaded && vftLoading){
    html += `<div class="sheet-loading">연동 코드(CBE) 불러오는 중…</div>`;
    sheetContent.innerHTML = html;
    bindSheetClose(); bindSheetBack(code);
    return;
  }

  const myBases = distinctiveBasesOf(code);
  if(myBases.length === 0){
    html += `<div class="sheet-section-title">연결된 회로</div>`;
    html += `<div class="sheet-empty">이 회로는 구역 전용 연동 코드가 없어 그룹을 찾을 수 없습니다.</div>`;
    sheetContent.innerHTML = html;
    bindSheetClose(); bindSheetBack(code);
    return;
  }

  const np = nodePrefix(code);
  const members = DATA.filter(d => {
    if(d.code === code) return true;
    if(nodePrefix(d.code) !== np) return false;
    const bases = distinctiveBasesOf(d.code);
    return bases.some(b => myBases.includes(b));
  });

  if(members.length <= 1){
    html += `<div class="sheet-section-title">연결된 회로</div>`;
    html += `<div class="sheet-empty">이 회로와 연동 코드가 겹치는 다른 회로가 없습니다.</div>`;
    sheetContent.innerHTML = html;
    bindSheetClose(); bindSheetBack(code);
    return;
  }

  const myCodes = distinctiveCodesOf(code);
  html += `<div class="sheet-section-title">연결된 회로 · 연동코드 ${myCodes.join(', ')} (${members.length})</div>`;
  html += `<div class="group-list">`;
  members.forEach(m => {
    const isCurrent = m.code === code;
    html += `
      <button class="group-row ${isCurrent ? 'current' : ''}" data-code="${escapeHtml(m.code)}">
        <div class="top-line">
          <span class="code mono">${escapeHtml(m.code)}</span>
          ${badge(m.type)}
        </div>
        <div class="gname">${escapeHtml(m.name)}</div>
      </button>`;
  });
  html += `</div>`;

  sheetContent.innerHTML = html;
  bindSheetClose();
  bindSheetBack(code);

  sheetContent.querySelectorAll('.group-row').forEach(btn => {
    btn.addEventListener('click', () => {
      const targetCode = btn.dataset.code;
      // 검색창에도 반영해서 위/아래 5개 리스트와 동기화
      qEl.value = targetCode;
      doSearch();
      openActionSheet(targetCode);
    });
  });
}

function bindSheetClose(){
  const btn = document.getElementById('sheetCloseBtn');
  if(btn) btn.addEventListener('click', closeSheet);
}

// 카드를 탭했을 때 뜨는 선택 메뉴 (포인트 자세히 보기 / 연결된 회로 리스트 보기)
function openActionSheet(code){
  sheetPanel.dataset.openCode = code;
  sheetPanel.dataset.openView = 'menu';
  const item = DATA.find(d => d.code === code);

  let html = `<button class="sheet-close" id="sheetCloseBtn" aria-label="닫기">✕</button>`;
  html += `<div class="sheet-code mono">${escapeHtml(code)}</div>`;
  if(item) html += `<div class="sheet-name">${escapeHtml(item.name)}</div>`;

  html += `<div class="sheet-section-title">선택</div>`;
  html += `<div class="action-list">
    <button class="action-btn" id="actDetail">
      <span class="action-icon">🔍</span>
      <span class="action-text">
        <span class="action-title">포인트 자세히 보기</span>
        <span class="action-sub">TypeLabel, 감도, CBE 연동 등 상세정보</span>
      </span>
    </button>
    <button class="action-btn" id="actGroup">
      <span class="action-icon">🔗</span>
      <span class="action-text">
        <span class="action-title">연결된 회로 리스트 보기</span>
        <span class="action-sub">같은 위치(구역)에 묶인 회로 전체 보기</span>
      </span>
    </button>
  </div>`;

  sheetContent.innerHTML = html;
  bindSheetClose();
  document.getElementById('actDetail').addEventListener('click', () => renderSheetContent(code));
  document.getElementById('actGroup').addEventListener('click', () => renderGroupContent(code));

  sheetBackdrop.classList.add('show');
  sheetPanel.classList.add('show');
  if(!vftLoaded) loadVftData();
}

function closeSheet(){
  sheetBackdrop.classList.remove('show');
  sheetPanel.classList.remove('show');
  delete sheetPanel.dataset.openCode;
  delete sheetPanel.dataset.openView;
}

sheetBackdrop.addEventListener('click', closeSheet);

mainEl.addEventListener('click', (e) => {
  const bodyEl = e.target.closest('.row .body');
  if(bodyEl && bodyEl.dataset.code){
    openActionSheet(bodyEl.dataset.code);
  }
});

document.addEventListener('DOMContentLoaded', () => {
  qEl.focus();
  loadFromGoogleSheet();
  loadVftData();
});
</script>
</body>
</html>
